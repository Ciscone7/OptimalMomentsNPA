[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimalsdp"
version = "0.1.0"
description = "OptimalSDP Simulations"
authors = [{name = "Francesco", email = "fflora@icfo.net"}]
dependencies = [
    "cvxpy",
    "equinox",
    "h5py",
    "jax",
    "matplotlib",
    "numpy",
    "numpyencoder",
    "optax",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "qutip",
    "pillow"
]

[tool.setuptools.packages.find]
where = ["src"]
